[project]
name = "mindmap-backend"
version = "0.1.0"
description = "FastAPI backend for the Mind Map Generator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "supabase>=2.9",
    "httpx>=0.27",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # Line length handled by formatter
    "B904",  # Allow raising HTTPException without explicit 'from' chaining
    "B008",  # Allow FastAPI Depends, Form, File, Query in function signature defaults
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["app", "."]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]
