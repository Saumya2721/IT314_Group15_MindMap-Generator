[project]
name = "mindmap-llm"
version = "0.1.0"
description = "Seed processing, retrieval and mind map generation for the Mind Map Generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "fastembed>=0.9.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pinecone>=10.0.0",
    "pinecone-text>=0.11.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pypdf>=6.20.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "mindmap_llm"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pinecone_text.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
