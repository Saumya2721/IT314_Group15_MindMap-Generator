[project]
name = "mindmap-llm"
version = "0.1.0"
description = "Seed processing, retrieval and mind map generation for the Mind Map Generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "langgraph>=0.2.0",
    "pinecone>=5.0.0",
    "fastembed>=0.3.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # Line length handled by formatter
    "B904",  # Allow raising exceptions without explicit 'from' chaining
    "B905",  # zip without strict=
]

[tool.ruff.lint.per-file-ignores]
"mindmap_llm/worker/settings.py" = ["E402"]
"mindmap_llm/scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "mindmap_llm"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["mindmap_llm", "."]
